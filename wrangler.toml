name = "cf-ai-incident-war-room"
main = "src/index.ts"
compatibility_date = "2026-02-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"

[ai]
binding = "AI"
remote = true

[[durable_objects.bindings]]
name = "WAR_ROOM"
class_name = "IncidentWarRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["IncidentWarRoom"]
